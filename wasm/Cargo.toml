[package]
name = "webgl"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = "0.3.70"
nalgebra-glm = "0.19.0"
wasm-bindgen = "0.2.93"

winit = { version = "0.29", features = ["rwh_05"] }
env_logger = "0.11.5"
log = "0.4"
wgpu = "22.0"

[dependencies.web-sys]
version = "0.3.70"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlShader",
    "WebGlProgram",
    "WebGlBuffer",
    "WebGlVertexArrayObject",
    "WebGlUniformLocation",
]
